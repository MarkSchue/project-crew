name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit, integration, and security tests
        run: pytest -q tests/unit tests/integration tests/security
      - name: Run capability evaluation regression suite
        run: pytest -q tests/evaluation
      - name: Validate fixture registry
        run: |
          mas registry validate tests/fixtures/registry --schemas ../project-template-repository/schemas
