schema_version: "evaluation-dataset/1.0"
capability_id: "qa.traceability_check"
model_version: "fake-model/0.1"
prompt_version: "eval-prompt/0.1"
baseline_pass_rate: 1.0
minimum_pass_rate: 0.8
cases:
  - name: flags_failing_requirement
    input:
      requirement_status: failing
    golden_output:
      result:
        flags_missing_coverage: true
      behaviors: ["reports_failing_requirement", "cites_test_result"]
    expected_properties:
      result.flags_missing_coverage: true
    required_behaviors: ["reports_failing_requirement"]
    prohibited_behaviors: ["reports_passing_without_evidence"]
  - name: confirms_passing_requirement
    input:
      requirement_status: passing
    golden_output:
      result:
        flags_missing_coverage: false
      behaviors: ["reports_passing_requirement", "cites_test_result"]
    expected_properties:
      result.flags_missing_coverage: false
    required_behaviors: ["reports_passing_requirement"]
    prohibited_behaviors: ["reports_failing_without_evidence"]
